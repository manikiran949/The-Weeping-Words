<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>The Weeping Words</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- 3D Scene Container -->
    <div id="scene-container"></div>

    <!-- Jumpscare Overlay -->
    <div id="jumpscare-overlay"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
      
      <!-- Telemetry HUD (hidden by default, shown during Setup/Game) -->
      <div id="telemetry-hud" class="hidden">
        <div class="telemetry-row">Pitch: <span id="tel-pitch">0.0°</span></div>
        <div class="telemetry-row">EAR: <span id="tel-ear">0.0</span></div>
        <div class="telemetry-row">Gaze: <span id="tel-gaze">0.0</span></div>
        <div class="telemetry-row badge" id="tel-badge">TRACKING OK</div>
      </div>
      
      <!-- SCREEN: INTRO -->
      <div id="screen-intro" class="screen active">
        <h1 class="title glitch-text" data-text="THE WEEPING WORDS">THE WEEPING WORDS</h1>
        <p class="subtitle">Do not look away.</p>
        <button id="btn-grant-camera" class="btn-primary">Grant Camera Access</button>
        <p id="camera-error" class="error-text" hidden></p>
      </div>

      <!-- SCREEN: SETUP (Calibration) -->
      <div id="screen-setup" class="screen">
        <h2>Prepare the Ritual</h2>
        <div id="setup-video-container" class="video-container large">
          <video id="webcam-video" autoplay playsinline></video>
          <canvas id="landmark-canvas-setup" class="landmark-canvas"></canvas>
        </div>
        <p id="setup-status" class="status-text warning">Waiting for camera...</p>
        <button id="btn-start-game" class="btn-primary" disabled>Begin</button>
      </div>

      <!-- SCREEN: GAME (HUD) -->
      <div id="screen-game" class="screen">
        <!-- Threat meter bar – fixed to very top -->
        <div class="threat-meter">
          <div class="threat-label">DEMON PROXIMITY</div>
          <div class="threat-track">
            <div id="threat-meter-bar" class="threat-bar"></div>
          </div>
        </div>

        <!-- Single-line Typing Area (top-positioned for eye tracking) -->
        <div class="typing-wrapper">
          <div class="typing-line-hud">
            <span id="typing-line-label" class="line-label">1 / 1</span>
            <div class="typing-progress-track">
              <div id="typing-progress-bar" class="typing-progress-bar"></div>
            </div>
          </div>
          <div id="typing-container" class="typing-text">
            <!-- Spans injected by TypingEngine – one line at a time -->
          </div>
        </div>

        <!-- Bottom HUD – webcam only -->
        <div class="hud-bottom">
          <div id="game-video-container" class="video-container small">
            <!-- Webcam injected here by UIManager -->
            <canvas id="landmark-canvas-game" class="landmark-canvas"></canvas>
            <div class="rec-indicator">● REC</div>
          </div>
        </div>
      </div>

      <!-- SCREEN: WIN -->
      <div id="screen-win" class="screen">
        <h1 class="title holy-text">THE DEMON IS BANISHED</h1>
        <p class="subtitle">Your soul is safe... for now.</p>
        <button id="btn-restart-win" class="btn-primary">Play Again</button>
      </div>

      <!-- SCREEN: GAME OVER (Time Displacement) -->
      <div id="screen-gameover" class="screen">
        <div class="static-bg"></div>
        <div class="time-displacement">
          <p class="displacement-label">TEMPORAL DISPLACEMENT DETECTED</p>
          <div id="year-counter" class="year-counter">2026</div>
          <div id="era-reveal" class="era-reveal hidden">
            <p id="era-location" class="era-location"></p>
            <p class="era-flavor"></p>
          </div>
        </div>
        <h1 class="title bloody-text" id="gameover-title" style="opacity:0">YOU LOOKED AWAY</h1>
        <button id="btn-restart-lose" class="btn-primary" style="opacity:0">Try to Return</button>
      </div>

    </div>

    <!-- Hidden audio element for Web Audio API context generation -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
